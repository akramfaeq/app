name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets
        run: npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set icon mdpi
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          echo '' | base64 -d > android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          echo '' | base64 -d > android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

      - name: Set icon hdpi
        run: |
          mkdir -p android/app/src/main/res/mipmap-hdpi
          echo '' | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo '' | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

      - name: Set icon xhdpi
        run: |
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          echo '' | base64 -d > android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          echo '' | base64 -d > android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

      - name: Set icon xxhdpi
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          echo '' | base64 -d > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          echo '' | base64 -d > android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

      - name: Set icon xxxhdpi
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          echo '' | base64 -d > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo '' | base64 -d > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png


      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manga-nova-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
