name: manga_nova
description: Manga Nova - تطبيق المانغا
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Supabase
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1

  # Network & Data
  http: ^1.2.0
  cached_network_image: ^3.3.1

  # Storage
  shared_preferences: ^2.2.2

  # UI
  google_fonts: ^8.2.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
